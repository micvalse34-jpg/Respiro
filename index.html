<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Respiro">
<title>Respiro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12232A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFE9; --surface:#F8F9F5; --surface2:#E1E6DF; --line:#D0D7CF; --ink:#172428; --muted:#5A696B;
  --in:#3A8BA1; --hold:#6A9A5B; --out:#B47B3B; --accent:#2F7F95; --accent-ink:#FFFFFF; --warn:#A54F3B;
  --c-calma:#3A8BA1; --c-energia:#C07A2C; --c-sonno:#5A5E9A; --c-focus:#5F8F55; --c-corpo:#9A6A55; --c-neutro:#6D7B7D;
  --glow-in:rgba(58,139,161,.26); --glow-hold:rgba(106,154,91,.24); --glow-out:rgba(180,123,59,.24);
  --tint:rgba(23,36,40,.04); --tongue:#D98C80; --hl:#ffffff; --hlo:.22;
  --serif:'Literata', Georgia, 'Times New Roman', serif;
  --sans:'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12232A; --surface:#1A2E36; --surface2:#233B44; --line:#2E4750; --ink:#E6EEEE; --muted:#98AEB2;
    --in:#86C6D7; --hold:#B3D5A4; --out:#E3B680; --accent:#86C6D7; --accent-ink:#0F2128; --warn:#E59C88;
    --c-calma:#86C6D7; --c-energia:#E9B26C; --c-sonno:#A9ACEB; --c-focus:#B3D5A4; --c-corpo:#DDA58C; --c-neutro:#A5B6B9;
    --glow-in:rgba(134,198,215,.22); --glow-hold:rgba(179,213,164,.2); --glow-out:rgba(227,182,128,.2);
    --tint:rgba(230,238,238,.05); --tongue:#C77A70; --hl:#ffffff; --hlo:0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12232A; --surface:#1A2E36; --surface2:#233B44; --line:#2E4750; --ink:#E6EEEE; --muted:#98AEB2;
  --in:#86C6D7; --hold:#B3D5A4; --out:#E3B680; --accent:#86C6D7; --accent-ink:#0F2128; --warn:#E59C88;
  --c-calma:#86C6D7; --c-energia:#E9B26C; --c-sonno:#A9ACEB; --c-focus:#B3D5A4; --c-corpo:#DDA58C; --c-neutro:#A5B6B9;
  --glow-in:rgba(134,198,215,.22); --glow-hold:rgba(179,213,164,.2); --glow-out:rgba(227,182,128,.2);
  --tint:rgba(230,238,238,.05); --tongue:#C77A70; --hl:#ffffff; --hlo:0; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0;letter-spacing:-.005em}
p{margin:.35em 0}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem} .hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* ---- testata e navigazione (in flusso, sticky) ---- */
.top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:14px 20px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.35rem}
.brand svg{width:26px;height:26px}
.iconbtn{background:none;border:0;padding:9px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:24px;height:24px}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.nav-in{max-width:640px;margin:0 auto;padding:0 20px}
.seg-nav{display:flex;background:var(--surface2);border-radius:999px;padding:4px}
.seg-nav button{flex:1;border:0;background:none;border-radius:999px;padding:9px 4px;font-size:.9rem;color:var(--muted);white-space:nowrap}
.seg-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding-bottom:60px}

/* ---- home ---- */
.hero{position:relative;padding:18px 0 8px;display:flex;align-items:center;gap:18px}
.orb{flex:none;width:86px;height:86px;position:relative}
.orb i{position:absolute;inset:0;border-radius:50%}
.orb .o1{border:1.5px solid var(--line)}
.orb .o2{background:radial-gradient(circle at 45% 40%,var(--in),transparent 72%);opacity:.75;transform:scale(.55);animation:orb 11s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(.55);opacity:.55}36%{transform:scale(.98);opacity:.9}55%{transform:scale(.98);opacity:.9}}
@media (prefers-reduced-motion: reduce){.orb .o2{animation:none;transform:scale(.8)}}
.hero h1{font-size:2.05rem}
.hero p{color:var(--muted);margin-top:6px}
.states{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.state{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;background:var(--surface);border-radius:18px;padding:14px 14px 13px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.state::after{content:'';position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--cat);opacity:.16}
.state:last-child:nth-child(odd){grid-column:1 / -1;min-height:78px}
.state b{font-size:1.02rem;font-weight:700;line-height:1.25}
.state span{font-size:.84rem;color:var(--muted);line-height:1.3}
.state:focus-visible{outline:2px solid var(--accent)}
@media (max-width:350px){.states{grid-template-columns:1fr}}
.paths{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.path{flex:1 1 140px;border:1px solid var(--line);background:none;border-radius:16px;padding:12px 14px;text-align:left}
.path b{display:block;font-size:.95rem}
.path span{font-size:.82rem;color:var(--muted)}
.steps{display:flex;gap:6px;margin:16px 0 4px}
.steps span{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ink)}
.q{font-size:1.6rem;margin:8px 0 4px}
.qsub{color:var(--muted);margin-bottom:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:var(--surface);border-radius:16px;padding:15px 16px;margin-bottom:8px}
.opt b{font-weight:700}
.opt span{font-size:.86rem;color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--accent)}

/* ---- raccomandazioni ---- */
.rec{background:var(--surface);border-radius:22px;padding:18px;margin:12px 0}
.rec.best{box-shadow:inset 0 0 0 1.5px var(--accent)}
.rec .flag{font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.rec h3{font-size:1.35rem}
.rec .sig{margin:10px 0 6px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--muted);margin:8px 0 12px}
.facts b{color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---- firma del respiro ---- */
.sigsvg{display:block;overflow:visible}
.sig-in{stroke:var(--in)} .sig-out{stroke:var(--out)} .sig-hold{stroke:var(--hold)} .sig-rest{stroke:var(--muted)}

/* ---- biblioteca ---- */
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);margin:6px 0 12px;-webkit-appearance:none}
.needs{display:flex;flex-wrap:wrap;gap:8px}
.need{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 13px 7px 11px;font-size:.88rem;display:inline-flex;align-items:center;gap:7px}
.need i{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.need[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.filters select{width:100%;font-size:.9rem;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.toggle-line{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:8px 0}
.toggle-line input{width:20px;height:20px;accent-color:var(--accent)}
.group-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 6px}
.group-h h3{font-size:1.15rem}
.group-h span{font-size:.82rem;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0}
.prow button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr);gap:1px 14px;align-items:center;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.prow button:focus-visible{outline:2px solid var(--accent)}
.prow .sig{grid-row:1 / span 3}
.pname{font-family:var(--serif);font-size:1.08rem;font-weight:500;line-height:1.25;min-width:0}
.palias{grid-column:2;color:var(--muted);font-size:.84rem;line-height:1.3;min-width:0}
.pmeta{grid-column:2;font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:3px}
.int{display:inline-flex;gap:3px}
.int i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.int i.on{background:var(--muted)}
.int.i3 i.on{background:var(--c-energia)}

/* ---- scheda ---- */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:6px 0;font-size:.92rem}
.back svg{width:18px;height:18px}
.dhead{padding:6px 0 4px}
.dhead h2{font-size:2.1rem;margin-top:4px}
.dhead .alias{color:var(--muted);margin-top:2px}
.bigsig{margin:16px 0 8px;background:var(--surface);border-radius:20px;padding:16px 14px 10px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.badge{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.badge.nv{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.badge.m-guida{background:var(--hold);color:var(--bg)}
.lead{font-size:1.04rem}
.block{background:var(--surface);border-radius:20px;padding:6px 16px;margin:14px 0}
.block h3{font-size:1.02rem;font-family:var(--sans);font-weight:700;padding:12px 0 2px}
.param{padding:12px 0;border-bottom:1px solid var(--line)}
.param:last-child{border-bottom:0}
.param-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.param-val{font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px}
.stepper button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);font-size:1.25rem;line-height:1}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:30px;background:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.seg button{border:0;background:var(--surface2);border-radius:12px;padding:9px 13px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.quick button{border:0;background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:.86rem}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.summary{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.92rem;padding:10px 0 12px;font-variant-numeric:tabular-nums}
.summary .tot{font-weight:700;padding-top:7px;border-top:1px solid var(--line)}
.note{font-size:.86rem;color:var(--muted);margin:0 0 12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle input{flex:none;width:22px;height:22px;accent-color:var(--accent)}
details.info{border-bottom:1px solid var(--line)}
details.info:last-child{border-bottom:0}
details.info summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:'+';color:var(--muted);font-weight:400}
details.info[open] summary::after{content:'\2212'}
details.info > div{padding:0 0 14px}
.phase-list{list-style:none;padding:0;margin:0}
.phase-list li{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.phase-list .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.mech{border-left:3px solid var(--warn);padding:2px 0 2px 12px;margin:12px 0}
.src{font-size:.86rem;margin:6px 0}
.cta{margin:18px 0 8px}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:700;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.stickybar{position:sticky;bottom:0;z-index:4;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}

table.dt{width:100%;border-collapse:collapse;font-size:.84rem}
table.dt th,table.dt td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}

/* ---- sessione (vista in flusso, altezza calcolata in JS) ---- */
.session{position:relative;display:none;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;background:var(--bg)}
.session.open{display:flex}
.glow{position:absolute;left:50%;top:40%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.glow.g-in{background:radial-gradient(closest-side,var(--glow-in),rgba(0,0,0,0))}
.glow.g-hold{background:radial-gradient(closest-side,var(--glow-hold),rgba(0,0,0,0))}
.glow.g-out{background:radial-gradient(closest-side,var(--glow-out),rgba(0,0,0,0))}
.glow.on{opacity:1}
.s-top{position:relative;display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.s-title{flex:1;min-width:0}
.s-title b{display:block;font-family:var(--serif);font-weight:500;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-title span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}


.s-stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:6px 14px}
.s-circle{position:relative;touch-action:manipulation}
.s-circle svg{width:100%;height:100%;display:block;overflow:visible}





.nostrils{width:84px;height:36px}







.s-ctrl{position:relative;display:flex;gap:14px;justify-content:center;align-items:center;padding:10px 16px 16px;min-height:86px}
.round{width:62px;height:62px;border-radius:50%;border:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.round svg{width:26px;height:26px}
.round.big{width:76px;height:76px;background:var(--ink);color:var(--bg)}
.round.big svg{width:30px;height:30px}
.btn.breathe{background:var(--hold);color:#15241A;padding:16px 22px}
.s-notice{position:relative;margin:6px 18px 0;padding:10px 14px;border-radius:14px;background:var(--surface);font-size:.88rem;display:none}
.s-notice.show{display:block}
.s-end{position:relative;flex:1;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.s-end.show{display:flex}
.s-end h3{font-size:2rem;font-weight:400;margin-bottom:6px}

.ctrl-label{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px}

/* ---- allenamento, costruttore ---- */
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0}
.card h3{font-size:1.2rem}
.levels{list-style:none;padding:0;margin:8px 0}
.levels li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.levels li span.n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.8em}
.levels li.cur{font-weight:700}
.levels li.cur span.n{color:var(--accent)}
.lvbar{display:flex;gap:3px;margin:10px 0 4px}
.lvbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.lvbar i.on{background:var(--accent)}
.field{margin:10px 0}
.field label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:4px}
.field input,.field select,textarea,.ph-row select,.ph-row input,.rows-ed input{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);-webkit-appearance:none}
.ph-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ph-row .full{grid-column:1 / -1}
.rows-ed{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;margin:4px 0}
.err{color:var(--warn);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.errbox{margin:12px 20px;padding:12px 14px;border-radius:14px;background:var(--warn);color:#fff;font-size:.85rem;display:none}
.errbox.show{display:block}

/* ---- sessione v3 ---- */
.s-count{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(2.3rem,12vw,3.6rem);font-weight:400;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 10px var(--bg)}
.s-legend{display:flex;gap:14px;justify-content:center;font-size:.72rem;color:var(--muted);margin-top:-4px}
.s-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}





.s-txt{flex:1;min-width:0}
.s-step{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:1.1em}


.s-chan{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px;min-height:1.6em}
.chip-ch{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);box-shadow:inset 3px 0 0 var(--pc)}
.phbar{height:3px;background:var(--surface2);border-radius:2px;margin-top:10px;overflow:hidden}
.phbar i{display:block;height:100%;width:0;background:var(--muted)}
.strip{display:flex;gap:6px;justify-content:safe center;overflow-x:auto;overflow-y:hidden;padding:2px 14px;scrollbar-width:none;max-width:100%;width:100%}
.strip::-webkit-scrollbar{display:none}
.strip div{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 8px 6px;border-radius:14px;font-size:.72rem;color:var(--muted);min-width:64px;border:1px solid transparent}

.strip div b{font-size:.9rem;font-variant-numeric:tabular-nums}
.strip div em{font-style:normal;font-size:.66rem;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =====================================================================
   VALUTATORE E COMPILATORE
   ===================================================================== */
function evalX(x, ctx) {
  if (x === null || x === undefined) return null;
  if (typeof x === 'number') return x;
  if (typeof x === 'string') {
    if (x[0] === '.') return ctx.row ? Number(ctx.row[x.slice(1)]) : 0;
    if (x[0] === '@') return ctx.p[x.slice(1)];
    if (x in ctx.p) return Number(ctx.p[x]);
    if (x === '$time') return ctx.time;
    if (x === '$cycles') return ctx.cycles;
    return 0;
  }
  if (Array.isArray(x)) {
    const [op, a, b] = x; const A = evalX(a, ctx), B = evalX(b, ctx);
    switch (op) {
      case '*': return A * B; case '/': return B ? A / B : 0; case '+': return A + B; case '-': return A - B;
      case '=': return String(ctx.p[a] ?? A) === String(b) ? 1 : 0; case '>': return A > B ? 1 : 0;
    }
  }
  return 0;
}
function textX(t, ctx) {
  if (typeof t !== 'string') return '';
  if (t[0] === '@') return String(ctx.p[t.slice(1)] ?? '');
  return t.replace(/@(\w+)/g, (_, k) => String(ctx.p[k] ?? ''));
}
const round2 = v => Math.round(v * 100) / 100;

function expand(nodes, ctx, out, stripOf) {
  nodes.forEach((n, ni) => {
    if (n.if !== undefined && !evalX(n.if, ctx)) return;
    const sp = (ctx.sp || '') + '.' + ni;
    if (n.rep !== undefined) {
      const times = Math.max(0, Math.round(evalX(n.rep, ctx)));
      const simple = n.body.every(b => b.k);
      for (let i = 0; i < times; i++) {
        let strip = null;
        if (simple) strip = n.body.filter(b => b.if === undefined || evalX(b.if, ctx)).map(b => ({ k: b.k, zone: b.zone, s: b.s === null ? null : round2(evalX(b.s, ctx)), t: textX(b.t, ctx), ch: typeof b.ch === 'string' && b.ch[0] === '@' ? ctx.p[b.ch.slice(1)] : b.ch }));
        const cctx = simple ? { ...ctx, iter: i, of: times } : { ...ctx, iter: i, of: times, sp: sp + 'r' + i, round: times > 1 && !ctx.round ? i + 1 : ctx.round, roundN: times > 1 && !ctx.round ? times : ctx.roundN, stage: n.label ? textX(n.label, ctx) : ctx.stage };
        if (simple && n.label) cctx.stage = textX(n.label, ctx);
        expand(n.body, cctx, out, strip ? { strip, i, of: times, step: sp } : stripOf);
        if (n.gap && i < times - 1) expand(n.gap, { ...cctx, sp: sp + 'g' + i }, out, null);
      }
      return;
    }
    if (n.each) {
      const rows = ctx.p[n.each] || [];
      rows.forEach((row, i) => expand(n.body, { ...ctx, row, rowIdx: i, rowsN: rows.length, sp: sp + 'w' + i }, out, null));
      return;
    }
    const s = n.s === null ? null : round2(evalX(n.s, ctx));
    if (s !== null && s <= 0) return;
    const ch = typeof n.ch === 'string' && n.ch[0] === '@' ? ctx.p[n.ch.slice(1)] : n.ch;
    const seg = { k: n.k, s, ch, t: textX(n.t, ctx), counter: n.counter ? (n.counter === true ? 10 : n.counter) : 0, zone: n.zone, step: stripOf ? stripOf.step + (ctx.sp || '') : sp };
    if (n.to !== undefined) seg.to = n.to;
    if (stripOf) { seg.strip = stripOf.strip; seg.si = out.filter(x => x.strip === stripOf.strip).length; seg.cyc = stripOf.i + 1; seg.cycN = stripOf.of; }
    if (ctx.row) { seg.row = ctx.rowIdx + 1; seg.rowN = ctx.rowsN; }
    if (ctx.round) { seg.round = ctx.round; seg.roundN = ctx.roundN; }
    if (ctx.stage) seg.stage = ctx.stage;
    out.push(seg);
  });
  return out;
}

function paramsOf(pr, overrides = {}) {
  const p = {};
  for (const d of pr.params || []) p[d.k] = d.def;
  return Object.assign(p, overrides);
}
function cycleLength(pr, p) {
  const node = findCycles(pr.seq);
  if (!node) return 0;
  const segs = expand(node.body, { p, time: 0, cycles: 1 }, [], null);
  if (segs.some(s => s.s === null)) return null;
  return round2(segs.reduce((a, s) => a + s.s, 0));
}
function findCycles(nodes) {
  for (const n of nodes) {
    if (n.rep === '$cycles') return n;
    if (n.body) { const f = findCycles(n.body); if (f) return f; }
  }
  return null;
}
/* tempo richiesto -> cicli interi (adattamento più vicino, mai riempitivi) */
function planDose(pr, p, requested) {
  if (pr.dose !== 'time') return null;
  const len = cycleLength(pr, p);
  if (!len) return { requested, cycles: null, practice: requested, cycleLen: null, exact: true };
  const cycles = Math.max(1, Math.round(requested / len));
  const practice = round2(cycles * len);
  return { requested, cycles, practice, cycleLen: len, exact: Math.abs(practice - requested) < 0.01, down: Math.max(1, Math.floor(requested / len)), up: Math.ceil(requested / len) };
}

/* compila una pratica in una timeline deterministica.
   opts: {time, prep, fin, cycles} -> {segs, practiceTime, prep, fin, timedTotal, hasFree} */
function compile(pr, p, opts = {}) {
  const prep = opts.prep ?? 10, fin = opts.fin ?? 10;
  let cycles = opts.cycles, time = opts.time ?? pr.def ?? 300;
  if (pr.dose === 'time' && cycles == null) {
    const d = planDose(pr, p, time); cycles = d.cycles; if (d.cycles) time = d.practice;
  }
  const main = expand(pr.seq, { p, time, cycles }, [], null).map(s => ({ ...s, part: 'main' }));
  const segs = [];
  if (prep > 0 && !opts.noPrep) segs.push({ k: 'rest', s: prep, t: 'Preparati: posizione comoda, respiro naturale', part: 'prep' });
  segs.push(...main);
  if (fin > 0 && !opts.noFin) segs.push({ k: 'rest', s: fin, t: 'Torna al respiro naturale', part: 'fin' });
  return summarize(segs, cycles);
}
function summarize(segs, cycles) {
  const sum = part => round2(segs.filter(s => s.part === part && s.s !== null).reduce((a, s) => a + s.s, 0));
  const practiceTime = sum('main');
  const timedTotal = round2(segs.filter(s => s.s !== null).reduce((a, s) => a + s.s, 0));
  return { segs, cycles, practiceTime, prep: sum('prep'), fin: sum('fin'), trans: sum('trans'), timedTotal, hasFree: segs.some(s => s.s === null) };
}
/* programmi composti: una sola preparazione e un solo finale, transizioni brevi */
function compileComposite(parts, opts = {}) {
  const prep = opts.prep ?? 10, fin = opts.fin ?? 10, gap = opts.gap ?? 6;
  const segs = [];
  if (prep) segs.push({ k: 'rest', s: prep, t: 'Preparati: posizione comoda, respiro naturale', part: 'prep' });
  parts.forEach((c, i) => {
    const pr = getPractice(c.id); const p = paramsOf(pr, c.p);
    const r = compile(pr, p, { time: c.time, prep: 0, fin: 0, cycles: c.cycles });
    if (i > 0) segs.push({ k: 'rest', s: gap, t: 'Cambio: ' + pr.name, part: 'trans' });
    r.segs.forEach(s => segs.push({ ...s, comp: pr.name }));
  });
  if (fin) segs.push({ k: 'rest', s: fin, t: 'Torna al respiro naturale', part: 'fin' });
  return summarize(segs, null);
}
function getPractice(id) { return PRACTICES.find(p => p.id === id) || SPECIAL[id] || null; }

/* --- tabelle CO2/O2 calcolate su un massimo personale (scelte progettuali dichiarate) --- */
function co2Rows(max, pct, rows = 8, start = 120, step = 15, floor = 30) {
  const h = Math.max(5, Math.round(max * pct / 100));
  return Array.from({ length: rows }, (_, i) => ({ b: Math.max(floor, start - step * i), h }));
}
function o2Rows(max, top, rows = 8, rest = 120, low = 40) {
  return Array.from({ length: rows }, (_, i) => ({ b: rest, h: Math.max(5, Math.round(max * (low + (top - low) * i / (rows - 1)) / 100)) }));
}
function validateRows(rows) {
  const errs = [];
  if (!rows.length) errs.push('Aggiungi almeno una riga.');
  rows.forEach((r, i) => {
    if (!(r.b >= 10 && r.b <= 600)) errs.push(`Riga ${i + 1}: recupero tra 10 e 600 s.`);
    if (!(r.h >= 5 && r.h <= 600)) errs.push(`Riga ${i + 1}: ritenzione tra 5 e 600 s.`);
  });
  return errs;
}

function recommend(stateId, intensity, total, prep = 10, fin = 10) {
  const d = DECISION[stateId];
  const eligible = d.opts.filter(o => { const pr = getPractice(o.id); return Math.max(pr.int, o.minInt || 1) <= intensity; });
  const picked = []; const fams = new Set();
  for (const o of eligible) { const f = getPractice(o.id).fam; if (!fams.has(f)) { picked.push(o); fams.add(f); } }
  for (const o of eligible) if (picked.length < 3 && !picked.includes(o)) picked.push(o);
  picked.sort((a, b) => eligible.indexOf(a) - eligible.indexOf(b));
  const res = picked.slice(0, 3).map(o => {
    const pr = getPractice(o.id); const p = paramsOf(pr, o.p || {}); let plan, params = p;
    if (pr.dose === 'time') {
      const avail = Math.max(20, total - prep - fin);
      plan = compile(pr, p, { time: avail, prep, fin });
      if (plan.timedTotal > total + 0.5 && plan.cycles > 1) {
        const cycles = Math.max(1, Math.floor(avail / cycleLength(pr, p)));
        plan = compile(pr, p, { cycles, prep, fin });
      }
    } else {
      params = { ...p }; plan = compile(pr, params, { prep, fin });
      while (plan.timedTotal > total && params.rounds > 1) { params = { ...params, rounds: params.rounds - 1 }; plan = compile(pr, params, { prep, fin }); }
    }
    return { id: o.id, why: o.why, plan, params, time: plan.practiceTime };
  });
  return { list: res, note: d.note, composite: d.composite };
}

  q478: { std: { n: 4, u: 'cicli', d: '4 cicli: quelli suggeriti da Andrew Weil; con la pratica si può salire a 8' }, tod: 's',     story: 'Andrew Weil la chiama \u201cun tranquillante naturale per il sistema nervoso\u201d. Inspiri contando fino a 4, trattieni fino a 7, svuoti fino a 8 con un leggero soffio. La lunga espirazione e la pausa centrale lasciano poco spazio ai pensieri che corrono: per questo è una delle tecniche più usate per addormentarsi.',
    tips: [['Conta la proporzione, non i secondi', 'Conta il rapporto 4 : 7 : 8. Se è troppo, usa un\u2019unità più corta: il rapporto resta lo stesso.'], ['La lingua dietro i denti', 'La punta della lingua resta appoggiata dietro gli incisivi superiori anche durante l\u2019espirazione.']] },
  labbra: { std: { n: 100, d: '100 respiri, 2 dentro e 4 fuori (10 minuti, come nel programma studiato)' }, tod: 'p', story: 'Espirare tra le labbra socchiuse crea una piccola contropressione che tiene aperte le vie aeree. È una delle prime tecniche che si insegnano in riabilitazione respiratoria, perché riduce l\u2019affanno e rallenta il respiro. Per chi è sano diventa un modo semplice per allungare l\u2019espirazione.',
    tips: [['La candela', 'Immagina una candela a un palmo dalla bocca: la fiamma deve tremolare, non spegnersi.'], ['Niente guance gonfie', 'Se le guance si gonfiano stai spingendo troppo: lascia che l\u2019aria esca da sola.']] },
  conteggio: { std: { d: '10 minuti; nello studio 25 minuti per sessione' }, tod: 'ps', story: 'Contare i respiri è una delle pratiche di attenzione più antiche, e una delle poche misurate in laboratorio. L\u2019esercizio vero non è contare bene: è accorgersi di aver perso il conto e ricominciare da uno, senza giudicarsi. Ogni volta che succede, il muscolo dell\u2019attenzione lavora.',
    tips: [['Perdere il conto fa parte del gioco', 'Tocca \u201cHo perso il conto\u201d e riparti. Nello studio anche i più bravi sbagliavano un conteggio su cinque.'], ['Non guidare il respiro', 'Lascia che il respiro faccia quello che vuole: tu conti soltanto.']] },
  nadi: { tod: 'mp', std: { n: 28, d: '28 cicli completi, 5,5 secondi per fase: 10 minuti' }, def: { u: 5.5 },
    story: 'Nadi Shodhana significa \u201cpulizia dei canali\u201d. Nella tradizione yoga il respiro scorre in due canali sottili, uno a destra e uno a sinistra: alternare le narici li riequilibra. Al di là della metafora, è un respiro lento che richiede attenzione continua, e le ricerche mostrano un calo della pressione.',
    tips: [['Il gesto della mano', 'Mano destra: pollice sulla narice destra, anulare sulla sinistra, indice e medio piegati o appoggiati tra le sopracciglia.'], ['Si inizia e si finisce a sinistra', 'Un ciclo completo comprende entrambi i lati: dentro a sinistra, fuori a destra, dentro a destra, fuori a sinistra.'], ['Naso chiuso?', 'Con il raffreddore scegli un\u2019altra pratica: forzare il flusso in una narice ostruita crea tensione.']] },
  surya: { std: { n: 38, u: 'cicli', d: '38 cicli: lo standard di 5 minuti' }, tod: 'm', story: 'Surya è il sole. Nella tradizione, la narice destra è legata al calore e all\u2019azione: in Surya Bhedana si inspira sempre da destra e si espira da sinistra. È la versione energizzante del respiro a narici alterne, da usare al mattino.',
    tips: [['Sempre lo stesso verso', 'A differenza di Nadi Shodhana non si alterna: destra dentro, sinistra fuori, a ogni ciclo.'], ['Non la sera', 'Se la usi per svegliarti, evita di farla poco prima di dormire.']] },
  chandra: { std: { n: 30, u: 'cicli', d: '30 cicli: lo standard di 5 minuti' }, tod: 's', story: 'Chandra è la luna, il lato fresco e ricettivo. Inspiri sempre da sinistra ed espiri da destra: lo specchio di Surya Bhedana. È una pratica serale, lenta e silenziosa, per chiudere la giornata.',
    tips: [['Più lenta dell\u2019inspirazione', 'Lascia che l\u2019espirazione dalla narice destra sia un po\u2019 più lunga: il rapporto 1 : 1,5 è un buon inizio.']] },
  unilaterale: { std: { n: 33, u: 'cicli', d: '33 cicli: lo standard di 5 minuti' }, tod: 'ms', story: 'Una sola narice, dentro e fuori. Gli studi più vecchi hanno trovato che respirare a destra aumenta il consumo di ossigeno, mentre a sinistra riduce i segni di attivazione. La destra al mattino, la sinistra la sera: è la stessa logica di sole e luna.',
    tips: [['Scegli il lato in base all\u2019ora', 'Destra per svegliarti, sinistra per rallentare.']] },
  bhramari: { std: { n: 25, u: 'ronzii', d: '25 ronzii: lo standard di 5 minuti' }, tod: 's', story: 'Bhramari è l\u2019ape. Espiri producendo un ronzio basso e continuo, e la vibrazione riempie la testa. Con le orecchie chiuse il suono diventa interno e avvolgente, e il mondo esterno si allontana. È una delle pratiche più semplici per spegnere il chiacchiericcio mentale.',
    tips: [['Tono basso e costante', 'Non cantare: cerca la nota più bassa che puoi tenere senza sforzo.'], ['Prova a chiudere le orecchie', 'Con i pollici sui trago il ronzio diventa interno: è la versione con Shanmukhi mudra.']] },
  ujjayi: { tod: 'mp', std: { n: 38, d: '38 respiri, 4 secondi dentro e 4 fuori: 5 minuti' }, def: { a: 4, c: 4 },
    story: 'Il respiro dell\u2019oceano: restringendo appena la gola, l\u2019aria fa un fruscio simile alle onde che si ritirano sulla spiaggia. È il respiro di fondo di molte pratiche yoga, perché il suono fa da metronomo e tiene l\u2019attenzione ancorata.',
    tips: [['Usa la mano', 'Se il fruscio non viene, prova a bocca aperta: espira verso il palmo come per appannare uno specchio. Poi chiudi la bocca e mantieni lo stesso suono.'], ['Si sente da vicino', 'Il suono deve essere udibile a chi ti sta accanto, non dall\u2019altra parte della stanza.']] },
  sitali: { tod: 'mp', std: { n: 38, d: '38 respiri, 4 secondi dentro e 4 fuori' }, def: { a: 4, c: 4 },
    story: 'Il respiro che raffredda. Sitali fa passare l\u2019aria attraverso la lingua arrotolata come una cannuccia; Sitkari la fa sibilare tra i denti, con un mezzo sorriso. Nei testi yoga servono a calmare il calore del corpo e della mente; uno studio su persone ipertese ha trovato un calo marcato della pressione.',
    tips: [['Non riesci ad arrotolare la lingua?', 'Succede a molte persone, circa una su quattro, e non dipende dall\u2019impegno. Usa Sitkari, con i denti accostati.'], ['Sorridi', 'In Sitkari le labbra si aprono in un sorriso: è anche il modo più facile per far passare l\u2019aria.']] },
  dirga: { tod: 'ms', std: { n: 33, d: '33 respiri completi: lo standard di 5 minuti' }, def: { u: 1.5, c: 4.5 },
    story: 'Il respiro completo in tre parti: addome, costole, petto. È uno dei primi pranayama che si insegnano, perché ti fa scoprire quanto spazio hai davvero. L\u2019inspirazione sale come un\u2019onda, l\u2019espirazione scende in ordine inverso.',
    tips: [['Cavalca l\u2019onda', 'Immagina che l\u2019onda parta dal basso ventre e dalla zona lombare, salga alle costole e arrivi al petto. In espirazione si ritira.'], ['Senza scatti', 'Le tre parti sono un unico movimento continuo, non tre respiri distinti.']] },
  viloma: { std: { n: 19, u: 'cicli', d: '19 cicli: lo standard di 5 minuti' }, tod: 'm', story: 'Viloma significa \u201ccontro il pelo\u201d: il respiro viene interrotto in tratti, come salire una scala a gradini. Ogni pausa ti fa sentire quanto volume hai preso. È un esercizio di controllo fine, utile prima di affrontare le ritenzioni.',
    tips: [['Un terzo alla volta', 'Ogni tratto riempie (o svuota) circa un terzo dei polmoni.']] },
  simha: { tod: 'm', std: { n: 38, d: '38 respiri, 4 secondi dentro e 4 fuori' }, def: { a: 4, c: 4, r: 0 },
    story: 'Il respiro del leone: bocca spalancata, lingua fuori verso il mento, un \u201chaaa\u201d potente dalla gola. Sembra buffo, ed è proprio questo il punto: scioglie mandibola, volto e gola, dove si accumula molta tensione. Nella tradizione si pratica seduti sui talloni, mani sulle ginocchia con le dita aperte come artigli.',
    tips: [['La postura del leone', 'Principianti: in ginocchio, seduti sui talloni. Più avanti: caviglie incrociate sotto il bacino. Tieni un cuscino a portata di mano.'], ['Lo sguardo', 'Guarda verso l\u2019alto, tra le sopracciglia, o verso la punta del naso.'], ['In pubblico', 'Puoi fare la versione silenziosa: bocca aperta e lingua fuori, senza suono.']] },
  inspira2: { std: { n: 50, d: '50 respiri: lo standard di 5 minuti' }, tod: 'mp', story: 'Lo specchio dell\u2019espirazione prolungata: qui la fase lunga è l\u2019inspirazione. È un modo dolce per alzare il tono senza ricorrere a respirazioni rapide, quando ti serve presenza ma non adrenalina.',
    tips: [['Ritmo tranquillo', 'Non è una respirazione veloce: l\u2019inspirazione è lunga e piena, l\u2019espirazione breve e passiva.']] },
  triplo: { std: { n: 50, d: '50 respiri: lo standard di 5 minuti' }, tod: 'm', story: 'Tre piccole inspirazioni nette dal naso, una sopra l\u2019altra, poi un\u2019espirazione dalla bocca. Il ritmo spezzato è sveglia per il corpo, come aprire le finestre al mattino.',
    tips: [['Con le braccia', 'Molti lo accompagnano alzando le braccia in tre tempi e lasciandole cadere sull\u2019espirazione.']] },
  kapalabhati: { tod: 'mp', std: { d: '3 round: 60 espirazioni, 15 secondi di ritenzione, 20 secondi di recupero' }, def: { rounds: 3, n: 60, pace: 60, ret: 1, rs: 15, rec: 20 },
    story: 'Kapala è il cranio, bhati la luce: \u201cil respiro che fa brillare il cranio\u201d. L\u2019espirazione è un colpo secco dell\u2019addome, l\u2019inspirazione arriva da sola. Il ritmo rapido sveglia corpo e mente in pochi minuti: perfetto al mattino o per la stanchezza di metà pomeriggio.',
    tips: [['Il lavoro è dell\u2019addome', 'Spalle e petto restano fermi. Pensa a spegnere una candela con l\u2019ombelico.'], ['A stomaco vuoto', 'Meglio lontano dai pasti. Se arrivano capogiri, rallenta o fermati.']] },
  bhastrika: { tod: 'm', std: { d: '3 round di respiri rapidi, con recupero tra i round' },
    story: 'Bhastrika è il mantice del fabbro: inspirazione ed espirazione entrambe attive, forti, regolari. Accende il fuoco come il soffio sulla brace. È più intensa di Kapalabhati, perché anche l\u2019inspirazione è spinta.',
    tips: [['Inizia lento', 'Prima trova un ritmo uniforme a 30\u201340 respiri al minuto, poi accelera.']] },
  fuoco: { tod: 'm', story: 'Il respiro di fuoco del Kundalini yoga: rapido, ritmico, a piccolo volume, dal naso, con l\u2019ombelico che pompa. Dove Kapalabhati spinge solo l\u2019espirazione, qui le due fasi sono uguali.',
    tips: [['Piccolo e veloce', 'Il volume è minimo: è il ritmo a fare il lavoro.']] },
  wimhof: { tod: 'm', std: { d: '3 round: 30 respiri profondi, ritenzione libera a vuoto, ritenzione di recupero di 15 secondi' }, def: { rounds: 3, n: 30, ti: 1.4, te: 1.6, h: 15 },
    story: 'Wim Hof, \u201cl\u2019uomo di ghiaccio\u201d, ha reso famoso questo ciclo: trenta respiri profondi che fanno salire l\u2019adrenalina, poi una lunga pausa a polmoni vuoti, poi un respiro pieno trattenuto. In laboratorio, insieme all\u2019esposizione al freddo, ha cambiato la risposta infiammatoria. Qui trovi solo la parte respiratoria.',
    tips: [['Mai in acqua', 'Dopo trenta respiri profondi la ritenzione può far perdere i sensi senza preavviso. Seduto o sdraiato, sempre.'], ['Al mattino, a stomaco vuoto', 'È energizzante: tienila lontana dalla sera.']] },
  tummo: { std: { d: '10 minuti, o la durata insegnata dal tuo insegnante' }, tod: 'm', story: 'Il fuoco interiore dei monaci tibetani. Le meditatrici studiate sull\u2019Himalaya riuscivano ad alzare la temperatura corporea, ma solo unendo respiro e visualizzazione. Qui l\u2019app ti dà solo il tempo: la tecnica si impara da un insegnante.',
    tips: [['Supporto, non guida', 'Usa i blocchi come marcatori per le fasi che hai imparato.']] },
  agnisara: { tod: 'm', story: 'Agni è il fuoco: a polmoni vuoti, l\u2019addome si contrae e si rilascia in onde rapide. È una pratica di pulizia dello yoga tradizionale, da fare al mattino a stomaco vuoto.',
    tips: [['Ginocchia piegate', 'Mani sulle cosce, schiena lunga: la posizione libera l\u2019addome.']] },
  kumbhaka: { std: { n: 11, u: 'cicli', d: '11 cicli con ritenzione 1 : 4 : 2: lo standard di 5 minuti' }, tod: 'm', story: 'Kumbha è il vaso: trattenere il respiro come un vaso pieno, o vuoto. Le ritenzioni strutturate sono il cuore del pranayama avanzato; i bandha, le contrazioni di gola, addome e pavimento pelvico, le accompagnano per chi le ha imparate.',
    tips: [['Prima i rapporti', 'Allunga le ritenzioni solo quando il rapporto precedente è diventato comodo.']] },
  buteyko_rb: { std: { d: '5 minuti di respirazione ridotta' }, tod: 'ps', story: 'Negli anni \u201950 il medico ucraino Konstantin Buteyko si convinse che molti dei suoi pazienti respiravano troppo. Il suo metodo insegna a respirare meno: un filo di fame d\u2019aria, mantenuto con calma, abitua il corpo a una CO\u2082 un po\u2019 più alta.',
    tips: [['Una fame d\u2019aria gentile', 'Deve essere lieve e costante. Se diventa urgente, fai un respiro normale e riparti.'], ['Bocca chiusa', 'Il naso è il filtro: tutta la pratica si fa respirando dal naso.']] },
  buteyko_pause: { std: { n: 19, u: 'pause', d: '19 pause: lo standard di 5 minuti' }, tod: 'p', story: 'Piccole pause dopo un\u2019espirazione normale, come respiri sospesi. È l\u2019esercizio d\u2019ingresso del metodo Buteyko: insegna a tollerare un poco di fame d\u2019aria e a riprendere con un respiro piccolo, non con un grande sospiro.',
    tips: [['Riprendi piano', 'Dopo la pausa il primo respiro deve essere tranquillo: se arriva un \u201crespirone\u201d, la pausa era troppo lunga.']] },
  breatheup: { std: { n: 10, d: '10 respiri lenti, circa 2 minuti: è una preparazione all\u2019apnea, non una pratica a sé' }, tod: 'p', story: 'Prima di un\u2019apnea, gli apneisti respirano lentamente e in modo rilassato: è il breathe-up. Non serve a caricare ossigeno, serve a calmare il battito. Respirare troppo, al contrario, è pericoloso.',
    tips: [['Niente iperventilazione', 'Volume normale, espirazione lunga. Se senti formicolii, rallenta.']] },
  apnea: { tod: 'p', story: 'L\u2019apnea statica a secco porta in salotto l\u2019allenamento degli apneisti. Il corpo risponde con il riflesso d\u2019immersione: il cuore rallenta e la milza rilascia globuli rossi. Si fa seduti o sdraiati, mai in acqua da soli.',
    tips: [['Le contrazioni sono normali', 'Verso la fine arrivano contrazioni del diaframma: sono un segnale, non un pericolo da sfidare.']] },
  ipovent: { tod: 'p', story: 'Pause a polmoni quasi vuoti: il corpo resta a basso volume e l\u2019ossigeno scende più in fretta. Nello sport si usa durante la corsa o lo sprint per simulare l\u2019altitudine; qui la versione è da fermo.',
    tips: [['Svuota senza forzare', 'Espira come in un sospiro normale, non fino in fondo.']] },
  imst: { tod: 'mp', std: { d: '30 respiri al giorno: 5 serie da 6' }, story: 'Trenta respiri contro una resistenza forte, cinque minuti al giorno. Uno studio dell\u2019Università del Colorado ha mostrato che allenare i muscoli inspiratori così abbassa la pressione quanto l\u2019esercizio aerobico. Serve un piccolo dispositivo a resistenza regolabile.',
    tips: [['Inspira come se volessi svuotare il dispositivo', 'L\u2019inspirazione è rapida e massima, l\u2019espirazione lenta e passiva.']] },
  imt: { tod: 'mp', story: 'L\u2019allenamento classico dei muscoli inspiratori: trenta respiri contro resistenza, una o due volte al giorno. Negli sportivi migliora la resistenza, soprattutto in chi parte meno allenato.',
    tips: [['Il carico lo decide il dispositivo', 'L\u2019app scandisce i respiri: la resistenza la imposti tu.']] },
  emst: { tod: 'mp', story: 'Allenare i muscoli espiratori, quelli della tosse e della voce. Nato per la riabilitazione, ad esempio nel Parkinson, è utile anche a cantanti e musicisti a fiato.',
    tips: [['Espirazione esplosiva', 'Il gesto è breve e forte, fino ad aprire la valvola del dispositivo.']] },
};
/* applica: default dei parametri, dose classica come default, momenti della giornata */
PRACTICES.forEach(pr => {
  const c = CONTENT[pr.id]; if (!c) return;
  pr.story = c.story; pr.tips = c.tips || []; pr.tod = c.tod || '';
  if (c.def) (pr.params || []).forEach(d => { if (c.def[d.k] !== undefined) d.def = c.def[d.k]; });
  if (c.std) {
    pr.std = c.std;
    if (c.std.n && pr.dose === 'time') { const len = cycleLength(pr, paramsOf(pr)); if (len) pr.def = Math.round(len * c.std.n * 100) / 100; }
  }
  pr.kind = pr.dose === 'time' && pr.mode !== 'supporto' && cycleLength(pr, paramsOf(pr)) ? 'ritmo' : 'esercizio';
});

/* ===== Respiro · icone anatomiche (duotone, generate in SVG) =====
   Naso visto di fronte e come allo specchio: la tua sinistra è a sinistra. */
const PHASE_COL = k => k === 'in' ? 'var(--in)' : k === 'out' ? 'var(--out)' : (k === 'hi' || k === 'ho') ? 'var(--hold)' : 'var(--muted)';
const INK = 'var(--ink)';
function chevrons(x, y, dir, col, anim, s) {
  s = s || 1;
  const d = dir === 'up' ? `M${x - 4 * s} ${y + 3 * s}L${x} ${y - 1 * s}L${x + 4 * s} ${y + 3 * s}` : `M${x - 4 * s} ${y - 3 * s}L${x} ${y + 1 * s}L${x + 4 * s} ${y - 3 * s}`;
  const off = dir === 'up' ? 6 * s : -6 * s;
  return `<g fill="none" stroke="${col}" stroke-width="${2.2 * s}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}" class="${anim ? 'chev c1' : ''}"/><path d="${d}" transform="translate(0 ${off})" class="${anim ? 'chev c2' : ''}" opacity="${anim ? 1 : 0.45}"/></g>`;
}
function noseIcon(ch, k, anim) {
  const col = PHASE_COL(k), flow = k === 'in' || k === 'out';
  const L = ch !== 'dx', R = ch !== 'sx', dir = k === 'in' ? 'up' : 'down';
  const nost = (cx, rot, on) => `<ellipse cx="${cx}" cy="41.5" rx="3.1" ry="1.8" transform="rotate(${rot} ${cx} 41.5)" fill="${on && flow ? col : INK}" fill-opacity="${on && flow ? 1 : 0.4}"/>`;
  let s = `<path d="M32 9C34.4 9 35.5 12.5 36.6 19L40.6 33.4C45 35.6 46.4 40.8 42.6 43.6C40 45.3 37 44 34.6 44.5C33 44.8 31 44.8 29.4 44.5C27 44 24 45.3 21.4 43.6C17.6 40.8 19 35.6 23.4 33.4L27.4 19C28.5 12.5 29.6 9 32 9Z" fill="${flow ? col : 'var(--muted)'}" fill-opacity=".16" stroke="${INK}" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/>`;
  s += nost(27.3, -14, L) + nost(36.7, 14, R);
  if (ch === 'sx') s += `<rect x="37.5" y="31" width="9" height="15" rx="4.5" transform="rotate(-16 42 38.5)" fill="var(--surface)" stroke="${INK}" stroke-opacity=".45" stroke-width="1.4"/>`;
  if (ch === 'dx') s += `<rect x="17.5" y="31" width="9" height="15" rx="4.5" transform="rotate(16 22 38.5)" fill="var(--surface)" stroke="${INK}" stroke-opacity=".45" stroke-width="1.4"/>`;
  if (flow) { if (L) s += chevrons(27.3, 51, dir, col, anim); if (R) s += chevrons(36.7, 51, dir, col, anim); }
  if (ch === 'ronzio' && flow) s += `<g class="${anim ? 'hum' : ''}" stroke="${col}" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M13 30q-3 5 0 10M8 27q-5 8 0 16M51 30q3 5 0 10M56 27q5 8 0 16"/></g>`;
  return s;
}
function mouthIcon(ch, k, anim) {
  const col = PHASE_COL(k), flow = k === 'in' || k === 'out', dir = k === 'in' ? 'up' : 'down';
  const tint = `fill="${flow ? col : 'var(--muted)'}" fill-opacity=".16" stroke="${INK}" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"`;
  const tongue = 'var(--tongue)';
  let s = '', ay = 50;
  if (ch === 'bocca' || ch === 'libero') {
    s += `<path d="M15 30C19 24.5 25.5 24 32 26C38.5 24 45 24.5 49 30C45 38.5 39 41 32 41C25 41 19 38.5 15 30Z" ${tint}/><ellipse cx="32" cy="31.5" rx="11" ry="5" fill="${INK}" fill-opacity=".72"/>`;
  } else if (ch === 'labbra') {
    s += `<ellipse cx="32" cy="31" rx="10" ry="7.5" ${tint}/><ellipse cx="32" cy="31" rx="3" ry="2.3" fill="${INK}" fill-opacity=".8"/>`; ay = 47;
  } else if (ch === 'simha') {
    s += `<path d="M13 26C18 20 26 20 32 22C38 20 46 20 51 26C47 37 40 41 32 41C24 41 17 37 13 26Z" ${tint}/><ellipse cx="32" cy="29" rx="13" ry="7" fill="${INK}" fill-opacity=".75"/><path d="M25 31Q24.5 52 32 52Q39.5 52 39 31Z" fill="${tongue}"/><path d="M32 35V47" stroke="${INK}" stroke-opacity=".25" stroke-width="1.2"/>`; ay = 58;
  } else if (ch === 'sitali') {

const NEWCONTENT = {
  drago: { tod: 'm', std: { d: '3 round: 30 respiri rapidi, 45 s di ritenzione a vuoto, 3 respiri di recupero' }, story: 'Una versione moderna, ispirata alle pratiche respiratorie dei sufi: il drago soffia fuoco in rapide raffiche, poi trattiene tutto in silenzio. I respiri veloci fanno salire adrenalina e attenzione; le ritenzioni riportano calma e abituano il corpo a più CO\u2082. È un risveglio deciso per il mattino.', tips: [['Al massimo due volte al giorno', 'È energizzante: bilanciala con pratiche lente, e non usarla la sera.'], ['La ritenzione non è una gara', 'I 45 secondi sono un tetto, non un obiettivo: tocca \u201cRiprendi a respirare\u201d quando serve.']] },

  rallenta: { tod: 's', std: { d: '3 gradini da 25 respiri: 3/3, 4/4, 5/5' }, story: 'Il modo più dolce per arrivare a un respiro lento è non chiederlo tutto subito. Si parte da tre secondi, e ogni gradino aggiunge un secondo: il corpo segue senza accorgersene, e in dieci minuti sei a sei respiri al minuto, pronto per dormire.', tips: [['A letto, luci spente', 'Tieni lo schermo in modalità notte, o segui solo i segnali sonori.']] },
  scala_ris: { tod: 'ps', std: { d: '11 respiri a 10/min, reset, 10 a 7,5/min, reset, 30 a 6/min' }, story: 'Una scala che scende verso la frequenza di risonanza. Ogni tappa rallenta il respiro, e tra una tappa e l\u2019altra una ritenzione di dieci secondi fa da \u201creset\u201d. Arrivati a sei respiri al minuto, cuore e respiro tendono a muoversi insieme: è la zona del biofeedback.', tips: [['Rallenta, non approfondire', 'L\u2019aria per respiro resta normale: cambia solo la velocità.']] },
  vagale: { tod: 'ps', std: { d: '4 tappe: 12 respiri a 6/min, 12 con espirazione doppia, 12 con ronzio, 6 in silenzio' }, story: 'Il nervo vago è il freno del sistema nervoso. Questa sequenza mette in fila tre modi di premerlo: respirare intorno ai sei respiri al minuto, allungare l\u2019espirazione, e farla vibrare con un ronzio. Alla fine, sei respiri in silenzio per sentire cosa è cambiato.', tips: [['Il ronzio va sentito', 'Labbra chiuse, denti leggermente separati: la vibrazione deve arrivare al viso.']] },
  sblocca_naso: { tod: 'mp', std: { d: '5 ripetizioni, un minuto di respiro tranquillo in mezzo' }, story: 'Un esercizio classico del metodo Buteyko per il naso chiuso: dopo un\u2019espirazione normale si chiude il naso e si muove la testa, finché il bisogno di respirare è forte. Secondo il metodo, la CO\u2082 che sale libera le cavità nasali. Molti lo trovano sorprendente la prima volta.', tips: [['Riprendi dal naso', 'Dopo la pausa respira solo dal naso, anche se è ancora un po\u2019 chiuso.'], ['Puoi camminare', 'Al posto del movimento della testa, cammina per la stanza a naso chiuso.']] },
  metta: { tod: 'm', story: 'Metta in pali significa benevolenza. È una delle meditazioni più studiate: si augura del bene a sé stessi, a una persona cara, a qualcuno di neutro, a qualcuno di difficile e infine a tutti. Qui il respiro lento fa da tappeto e ogni minuto la frase cambia.', tips: [['Le parole contano poco', 'Se una frase non ti suona, usa parole tue: conta l\u2019intenzione.'], ['La persona difficile', 'Se è troppo, torna a una persona cara: ci si arriva con il tempo.']] },
  lascia: { tod: 's', story: 'Ispirato allo Yoga Nidra, il \u201csonno dello yoga\u201d: ogni inspirazione è un\u2019ancora di presenza, ogni espirazione un permesso a lasciar andare. I pensieri arrivano, li noti e li lasci passare come nuvole. È fatto per accompagnarti verso il sonno.', tips: [['Occhi chiusi', 'Attiva i segnali sonori: le frasi sono solo un appoggio.']] },
  bodyscan: { tod: 's', story: 'Un viaggio dai piedi alla testa, con il respiro come guida. A ogni espirazione la zona su cui sei si ammorbidisce un po\u2019. È il modo più semplice per accorgersi di dove teniamo la tensione: spesso spalle, mandibola e fronte.', tips: [['Niente da correggere', 'Non devi rilassare per forza: basta notare. Spesso il rilascio arriva da solo.']] },
  sos: { tod: 'mps', std: { d: 'Circa 4 minuti: 3 sospiri, poi la sequenza 5-4-3-2-1 dei sensi' }, story: 'Quando arriva l\u2019ondata, il pensiero corre e il respiro sale nel petto. Questa sequenza fa due cose: tre sospiri profondi scaricano l\u2019attivazione, poi la tecnica dei cinque sensi riporta l\u2019attenzione al presente, una cosa alla volta. È breve per scelta.', tips: [['Ad alta voce, se puoi', 'Nominare le cose a voce alta funziona meglio che pensarle.'], ['Salvala nei preferiti', 'Così la trovi in un tocco quando serve.']] },
};

/* ===== Respiro · revisione: racconti più ricchi, consigli aggiuntivi, correzioni ===== */
const REVIEW = {
  coerente: { story: 'Immagina due pendoli appesi alla stessa trave: dopo un po\u2019 iniziano a oscillare insieme. Succede qualcosa di simile quando respiri intorno a sei volte al minuto: il battito accelera un poco a ogni inspirazione e rallenta a ogni espirazione, e queste onde diventano ampie e regolari. È il ritmo su cui si basa quasi tutto il biofeedback della variabilità cardiaca. Non serve respirare a fondo: basta che inspirazione ed espirazione abbiano la stessa durata. Dopo qualche minuto il respiro smette di essere un esercizio e diventa un metronomo interno.' },
  risonanza: { story: 'Ogni sistema ha una frequenza a cui risponde con più forza: un ponte, una corda di chitarra, anche il tuo cuore. Per la maggior parte delle persone sta tra 4,5 e 7 respiri al minuto, ma il numero esatto cambia da persona a persona e si trova con un sensore che prova ritmi diversi. Una volta trovato, resta abbastanza stabile nel tempo. Qui l\u2019app fa una cosa sola, e la fa bene: scandisce con precisione il tuo numero.', tips: [['Prima misura, poi pratica', 'La frequenza si trova con un dispositivo di biofeedback. Una volta trovata, tende a restare stabile.'], ['Espirazione un po\u2019 più lunga', 'Molti protocolli usano un rapporto 1 : 1,5 o 1 : 2: provalo se il ritmo uguale ti lascia un filo di tensione.'], ['Due sessioni brevi', 'Il biofeedback di solito si pratica ogni giorno: meglio due momenti brevi che uno lungo saltuario.']] },
  sospiro: { story: 'Lo fai già, decine di volte al giorno, senza accorgertene: è il sospiro. Il corpo lo usa per riaprire i piccoli alveoli che si chiudono quando respiriamo in modo superficiale. Nel 2023 un gruppo di Stanford ha chiesto a un centinaio di persone di dedicare cinque minuti al giorno a respirazioni diverse: il sospiro ripetuto, con doppia inspirazione e lunga espirazione, ha migliorato l\u2019umore più della meditazione. È il gesto più rapido che hai per scendere di un gradino quando la tensione sale.' },
  espirazione: { story: 'Quando espiri, il cuore rallenta per un istante; quando inspiri, accelera. È un riflesso antico, e lo puoi usare a tuo favore: se l\u2019espirazione dura più dell\u2019inspirazione, a ogni respiro il freno lavora un po\u2019 di più dell\u2019acceleratore. Sessanta respiri sono circa dieci minuti, il tempo per far scivolare via la giornata. Si può fare seduti, ma dà il meglio da sdraiati, con la luce già spenta.' },
  diaframmatica: { story: 'Sotto i polmoni c\u2019è un muscolo a forma di cupola, il diaframma: quando si contrae scende, l\u2019addome si gonfia e l\u2019aria entra quasi da sola. Guarda un neonato che dorme: respira così. Con gli anni e con lo stress molti di noi spostano il lavoro su petto, spalle e collo, muscoli fatti per gli sforzi, non per i ventimila respiri di ogni giorno. Questa pratica rimette il lavoro dove dovrebbe stare, e spesso porta con sé una sensazione di peso che si scioglie.' },
  box: { story: 'Quattro lati uguali: inspira, trattieni, espira, trattieni. La struttura è così semplice che si può seguire anche sotto pressione, e per questo è diventata popolare negli ambienti militari e tra chi deve restare lucido in situazioni difficili; la trovi anche col nome di respirazione tattica. Contare i lati del quadrato dà alla mente un compito chiaro, e le pause rallentano il respiro senza che tu debba pensarci. In uno studio recente ha migliorato l\u2019umore, anche se meno del sospiro ciclico.' },
  q478: { story: 'Il medico americano Andrew Weil l\u2019ha resa famosa definendola un tranquillante naturale per il sistema nervoso. Il rapporto è tutto: 4 per inspirare dal naso, 7 per trattenere, 8 per svuotare dalla bocca con un soffio leggero. La pausa centrale e la lunga espirazione rallentano il respiro fino a tre cicli al minuto e lasciano poco spazio ai pensieri che corrono. Weil consiglia di cominciare con quattro cicli e di salire solo con la pratica: meglio poco e spesso.' },
  labbra: { story: 'Soffiare piano attraverso le labbra socchiuse crea una piccola contropressione che tiene aperte le vie aeree più a lungo. Chi ha la BPCO spesso la scopre da solo, nei momenti di affanno, ed è una delle prime tecniche che si insegnano in riabilitazione respiratoria. Nel programma studiato si partiva da dieci minuti al giorno per arrivare a venticinque. Per chi è sano diventa il modo più semplice per allungare l\u2019espirazione senza contare.' },
  conteggio: { story: 'Contare i respiri è una delle pratiche di attenzione più antiche: la si trova nei testi buddhisti come nei manuali moderni di mindfulness. Nel 2014 un gruppo dell\u2019Università del Wisconsin l\u2019ha trasformata in una misura di laboratorio: contare da uno a nove, poi ricominciare, accorgendosi quando si perde il filo. Dopo quattro settimane di allenamento le persone vagavano meno con la mente. Il segreto è che l\u2019errore non è un fallimento: accorgersene è esattamente l\u2019allenamento.' },
  nadi: { story: 'Nadi Shodhana significa pulizia dei canali. Nella tradizione dello yoga il respiro scorre in due canali sottili, uno lunare a sinistra e uno solare a destra, e alternare le narici li riporta in equilibrio. Al di là della metafora, è un respiro lento che richiede attenzione continua: la mano si sposta, la narice cambia, il ritmo resta. Le ricerche mostrano in media un calo della pressione sistolica. Molti la usano prima di meditare, perché lascia la mente stranamente silenziosa.' },
  surya: { story: 'Surya è il sole. Nella tradizione, la narice destra è la porta del calore e dell\u2019azione: in Surya Bhedana si inspira sempre da destra e si espira sempre da sinistra, ciclo dopo ciclo. È la sorella energizzante del respiro a narici alterne, da usare al mattino o quando ti serve presenza. Qualche piccolo studio ha trovato che respirare dalla narice destra aumenta il consumo di ossigeno: un indizio, non una prova, ma coerente con la tradizione.' },
  chandra: { story: 'Chandra è la luna, il lato fresco e ricettivo. È lo specchio di Surya Bhedana: si inspira sempre da sinistra e si espira da destra, con un\u2019espirazione un po\u2019 più lunga. La tradizione la consiglia la sera, per raffreddare il corpo e la mente; un vecchio studio ha trovato che respirare dalla narice sinistra riduce alcuni segni di attivazione. È una pratica lenta e silenziosa, adatta a chiudere la giornata.' },
  unilaterale: { story: 'Una sola narice, dentro e fuori. Sembra un dettaglio, ma cambia la sensazione del respiro: più sottile, più concentrato. Gli studi più vecchi, piccoli ma curiosi, hanno trovato che respirare a destra aumenta il consumo di ossigeno, mentre a sinistra riduce i segni di attivazione. La destra al mattino, la sinistra la sera: è la stessa logica di sole e luna, in versione semplice.', tips: [['Scegli il lato in base all\u2019ora', 'Destra per svegliarti, sinistra per rallentare.'], ['Chiudi con delicatezza', 'Basta appoggiare il dito sull\u2019ala del naso: se premi troppo, la narice aperta si restringe.']] },
  bhramari: { story: 'Bhramari è l\u2019ape nera indiana. Espiri producendo un ronzio basso e continuo, e la vibrazione riempie la testa, il viso, il petto. Se chiudi le orecchie con i pollici il suono diventa interno e avvolgente, e il mondo fuori si allontana. Il ronzio allunga da solo l\u2019espirazione, ed è difficile rimuginare mentre si ronza. Per questo è una delle pratiche più semplici da proporre a chi dice di non riuscire a meditare.' },
  ujjayi: { story: 'Il respiro dell\u2019oceano. Restringendo appena la gola, l\u2019aria fa un fruscio simile alle onde che si ritirano sulla sabbia. È il respiro di fondo di molti stili di yoga: il suono fa da metronomo, ti dice subito se stai accelerando e tiene l\u2019attenzione ancorata. Ujjayi significa vittorioso: chi la pratica a lungo la descrive come un respiro che dà forza senza agitare.' },
  sitali: { story: 'Nei testi dello yoga sono i respiri che rinfrescano. In Sitali l\u2019aria entra attraverso la lingua arrotolata come una cannuccia e la senti fresca sulla punta; in Sitkari entra sibilando tra i denti, con un mezzo sorriso. La tradizione le consiglia d\u2019estate, dopo uno sforzo o quando la rabbia scalda. Uno studio su persone con pressione alta ha trovato un calo marcato della pressione dopo un mese di pratica quotidiana.', tips: [['Non riesci ad arrotolare la lingua?', 'Succede a molte persone, circa una su quattro, e non dipende dall\u2019impegno. Usa Sitkari, con i denti accostati.'], ['Sorridi', 'In Sitkari le labbra si aprono in un sorriso: è anche il modo più facile per far passare l\u2019aria.'], ['Non con l\u2019aria fredda', 'D\u2019inverno o all\u2019aperto con il freddo meglio un respiro nasale: l\u2019aria gelida irrita la gola.']] },
  dirga: { story: 'Il respiro completo in tre parti: addome, costole, petto. È uno dei primi pranayama che si insegnano, perché ti fa scoprire quanto spazio hai davvero: la maggior parte di noi ne usa una parte sola. L\u2019inspirazione sale come un\u2019onda che parte dal basso ventre e arriva sotto le clavicole, l\u2019espirazione scende in ordine inverso. Dopo qualche minuto il corpo sembra più ampio, e il respiro più lungo senza sforzo.' },
  viloma: { story: 'Viloma significa contro il pelo, contro la corrente naturale: il respiro viene interrotto in tratti, come salire una scala a gradini. A ogni pausa senti quanto volume hai preso e quanto ne resta. È un esercizio di controllo fine, che gli insegnanti propongono prima delle ritenzioni lunghe, e uno dei migliori per scoprire che il respiro si può dosare, non solo subire.' },
  simha: { story: 'Il respiro del leone. Bocca spalancata, lingua fuori verso il mento, sguardo verso l\u2019alto e un haaa potente dalla gola. Sembra buffo, ed è proprio questo il punto: mandibola, lingua, gola e volto sono i posti dove accumuliamo tensione senza saperlo, e il leone li scioglie tutti in un gesto. Nella tradizione si pratica in ginocchio, con le dita aperte come artigli. Dopo qualche respiro, di solito, scappa un sorriso.', tips: [['La postura del leone', 'Principianti: in ginocchio, seduti sui talloni. Più avanti: caviglie incrociate sotto il bacino. Tieni un cuscino a portata di mano.'], ['Lo sguardo', 'Guarda verso l\u2019alto, tra le sopracciglia, o verso la punta del naso.'], ['Se la gola si irrita, fai pause', 'Il suono viene dal fondo della gola, non dalle corde vocali: se raschia, fai qualche respiro normale tra un leone e l\u2019altro.']] },
  inspira2: { story: 'Lo specchio dell\u2019espirazione prolungata: qui la fase lunga è l\u2019inspirazione, e l\u2019espirazione è breve, quasi un lasciar cadere. Il ritmo resta lento, quindi non è una respirazione rapida, ma l\u2019accento sull\u2019entrata dà una sensazione di apertura e di presenza. È utile quando ti serve tono ma non adrenalina: prima di una riunione, dopo pranzo, a metà mattina.', tips: [['Ritmo tranquillo', 'Non è una respirazione veloce: l\u2019inspirazione è lunga e piena, l\u2019espirazione breve e passiva.'], ['Sguardo alto', 'Tieni il mento parallelo al pavimento e lo sguardo in avanti: la postura aiuta l\u2019effetto.']] },
  triplo: { story: 'Tre piccole inspirazioni nette dal naso, una sopra l\u2019altra, poi un\u2019espirazione dalla bocca. Il ritmo spezzato è una sveglia per il corpo, come aprire le finestre al mattino. Molte scuole la accompagnano alzando le braccia in tre tempi e lasciandole cadere con l\u2019espirazione. Breve, ritmica, un po\u2019 giocosa: ottima quando il caffè non basta.', tips: [['Con le braccia', 'Alza le braccia in tre tempi, una per inspirazione, e lasciale cadere sull\u2019espirazione.'], ['Se gira la testa, rallenta', 'Allunga l\u2019espirazione o fai qualche respiro normale: è un segnale di troppa ventilazione.']] },
  kapalabhati: { story: 'Kapala è il cranio, bhati la luce: il respiro che fa brillare il cranio. L\u2019espirazione è un colpo secco dell\u2019addome, come per spegnere una candela con l\u2019ombelico; l\u2019inspirazione arriva da sola, senza fare nulla. Nei testi dello yoga è una pratica di pulizia, e chi la fa al mattino la descrive come una doccia fredda dall\u2019interno. Il ritmo rapido sveglia corpo e mente in pochi minuti; la ritenzione alla fine di ogni round fa da pausa e da ascolto.' },
  bhastrika: { story: 'Bhastrika è il mantice del fabbro: inspirazione ed espirazione entrambe attive, forti e regolari, come il soffio che riaccende la brace. È più intensa di Kapalabhati, perché anche l\u2019inspirazione è spinta, e per questo si fa in round brevi con recupero in mezzo. Al termine il corpo è caldo e la mente sveglia: tienila per il mattino, mai prima di dormire.', tips: [['Inizia lento', 'Prima trova un ritmo uniforme a 30\u201340 respiri al minuto, poi accelera.'], ['Spalle ferme', 'Il movimento è dell\u2019addome e delle costole basse: se si alzano le spalle, rallenta.']] },
  fuoco: { story: 'Il respiro di fuoco del Kundalini yoga: rapido, ritmico, a piccolo volume, dal naso, con l\u2019ombelico che pompa come un pistone. Dove Kapalabhati spinge solo l\u2019espirazione, qui le due fasi sono uguali, e il suono ricorda un treno a vapore in lontananza. Chi la pratica la usa per accendersi senza muoversi dalla sedia.', tips: [['Piccolo e veloce', 'Il volume è minimo: è il ritmo a fare il lavoro.'], ['Fermati al primo capogiro', 'Torna a respirare normalmente, aspetta che passi, poi riparti più lento.']] },
  wimhof: { story: 'Wim Hof, l\u2019olandese detto uomo di ghiaccio, ha corso una mezza maratona a piedi nudi nella neve e nuotato sotto il ghiaccio. Il suo ciclo respiratorio è diventato famoso in tutto il mondo: trenta respiri profondi che fanno salire l\u2019adrenalina, una lunga pausa a polmoni vuoti, un respiro pieno trattenuto. Negli studi, insieme all\u2019esposizione al freddo, ha cambiato la risposta infiammatoria, ma la qualità della ricerca è ancora bassa. Qui trovi solo la parte respiratoria, che da sola è già un\u2019esperienza intensa.' },
  tummo: { story: 'Il fuoco interiore dei monaci tibetani. Le storie parlano di praticanti che asciugavano lenzuola bagnate sulla schiena nella notte himalayana. Uno studio del 2013 ha misurato monache esperte in Tibet: la temperatura del corpo saliva davvero, ma solo unendo il respiro forzato a una visualizzazione concentrata. Qui l\u2019app ti dà solo il tempo e i blocchi: la tecnica si impara da un insegnante.' },
  agnisara: { story: 'Agni è il fuoco della digestione. A polmoni vuoti, l\u2019addome si contrae e si rilascia in onde rapide, come un mantice che lavora dall\u2019interno. È una delle pratiche di pulizia dello yoga tradizionale, da fare al mattino a stomaco vuoto. Richiede di saper già trattenere a vuoto con comodità: l\u2019app scandisce i round, il movimento lo guidi tu.', tips: [['Ginocchia piegate', 'Mani sulle cosce, schiena lunga: la posizione libera l\u2019addome.'], ['Solo a stomaco vuoto', 'Lontano dai pasti, e non in gravidanza o con problemi addominali.']] },
  kumbhaka: { story: 'Kumbha è il vaso: trattenere il respiro come un vaso pieno d\u2019acqua, o completamente vuoto. Le ritenzioni strutturate sono il cuore del pranayama avanzato; nei testi classici sono considerate il cuore del pranayama. I bandha, le chiusure di gola, addome e pavimento pelvico, le accompagnano per chi le ha imparate. Un piccolo studio ha trovato che, dopo un ciclo con ritenzione interna, il cuore rallenta e i segnali vagali salgono.' },
  buteyko_rb: { story: 'Negli anni Cinquanta il medico sovietico Konstantin Buteyko si convinse che molti dei suoi pazienti respiravano troppo, e che questo peggiorasse asma e ansia. Il suo metodo, controverso ma ancora molto praticato, insegna a respirare meno: un filo di fame d\u2019aria, mantenuto con calma, abitua il corpo a una CO\u2082 un po\u2019 più alta. Non è una tecnica spettacolare: è un esercizio di pazienza, quasi invisibile.' },
  buteyko_pause: { story: 'Piccole pause dopo un\u2019espirazione normale, come respiri sospesi. È l\u2019esercizio d\u2019ingresso del metodo Buteyko: insegna a tollerare un poco di fame d\u2019aria e, soprattutto, a riprendere con un respiro piccolo invece che con un grande sospiro. Quel primo respiro dopo la pausa dice tutto: se è tranquillo, la pausa era giusta.' },
  breatheup: { story: 'Prima di un\u2019apnea, gli apneisti non si riempiono d\u2019aria: respirano lentamente, in modo rilassato, con espirazioni lunghe. È il breathe-up, e serve a calmare il battito e la mente, non a fare scorta di ossigeno. Respirare troppo, al contrario, è pericoloso, perché spegne il segnale che ti dice quando tornare a respirare.' },
  apnea: { story: 'L\u2019apnea statica a secco porta in salotto l\u2019allenamento degli apneisti. Quando trattieni il respiro a lungo il corpo attiva il riflesso d\u2019immersione, lo stesso di foche e delfini: il cuore rallenta e la milza si contrae, rilasciando globuli rossi. Con l\u2019allenamento le apnee si allungano, ma il punto non è il record: è restare calmi mentre il corpo chiede aria. Si fa seduti o sdraiati, mai in acqua da soli.' },
  ipovent: { story: 'Pause a polmoni quasi vuoti, non completamente svuotati: il corpo resta a basso volume e l\u2019ossigeno scende più in fretta. Nello sport si usa durante la corsa o il nuoto per ottenere alcuni effetti dell\u2019altitudine senza andare in montagna. Qui la versione è da fermo: utile per conoscere la sensazione, non per replicare i risultati degli atleti.' },
  imst: { story: 'Trenta respiri contro una resistenza forte, cinque minuti al giorno: è un allenamento di forza, come i pesi, ma per i muscoli che ti fanno inspirare. All\u2019Università del Colorado lo hanno studiato in adulti con la pressione sopra la norma: dopo sei settimane la pressione sistolica era scesa. Serve un piccolo dispositivo a resistenza regolabile, e un po\u2019 di costanza.' },
  imt: { story: 'L\u2019allenamento classico dei muscoli inspiratori: trenta respiri contro resistenza, una o due volte al giorno. Nasce nella riabilitazione ed è arrivato nello sport: in chi parte meno allenato migliora la resistenza, perché i muscoli del respiro si affaticano più tardi.' },
  emst: { story: 'Allenare i muscoli espiratori, quelli della tosse, della voce e della deglutizione. È nato in logopedia, per esempio nel Parkinson, dove in uno studio controllato ha migliorato la deglutizione. Lo usano anche cantanti e musicisti a fiato: un soffio breve ed esplosivo contro una valvola, poche ripetizioni, ogni giorno.' },
  drago: { story: 'Il drago soffia fuoco in raffiche rapide, poi si ferma, immobile, a polmoni vuoti. È una versione moderna, ispirata alle pratiche respiratorie sufi, dove il respiro ritmico accompagnava il movimento e il canto. I respiri veloci fanno salire adrenalina e attenzione; la lunga pausa e i respiri trattenuti alla fine riportano calma e abituano il corpo a più CO\u2082. È un risveglio deciso per il mattino, da non ripetere più di due volte al giorno.' },
  trefasi: { story: 'Una scossa al sistema nervoso, poi il rientro. Ogni round passa da cinque respiri ampi a una raffica rapida, e poi a cinque respiri lentissimi con una piccola pausa. L\u2019idea viene dagli sport da combattimento, dove gli atleti devono accendersi in fretta e restare lucidi. Il contrasto è il cuore dell\u2019esercizio: il corpo impara a salire e a scendere a comando. Ottima a metà pomeriggio, sconsigliata se sei in ansia.' },
  buteyko_prog: { story: 'Buteyko era convinto che molti di noi respirino troppo, in uno stato di allerta continuo. Questo esercizio simula un allenamento in quota: a ogni tappa il respiro si fa più lento e più leggero, prima allungando l\u2019espirazione, poi aggiungendo piccole pause. È come salire un sentiero di montagna un tornante alla volta: il corpo si adatta senza strappi, e alla fine respira meno senza sentirne il bisogno.' },
  rallenta: { story: 'Il modo più dolce per arrivare a un respiro lento è non chiederlo tutto subito. Si parte da tre secondi, il ritmo di una giornata ancora accesa, e ogni gradino aggiunge un secondo. Il corpo segue senza accorgersene, come quando si scende una scala al buio tenendosi al corrimano. In una decina di minuti sei a sei respiri al minuto, con il battito più lento e la mente già in penombra.' },
  scala_ris: { story: 'Una scala che scende verso la frequenza di risonanza. Si parte da dieci respiri al minuto, si passa a sette e mezzo, si arriva a sei: la zona in cui, per molte persone, cuore e respiro iniziano a muoversi insieme. Tra una tappa e l\u2019altra, una ritenzione di dieci secondi fa da reset, come un respiro trattenuto prima di tuffarsi. È il modo in cui il biofeedback cerca il ritmo giusto, senza bisogno di sensori.' },
  vagale: { story: 'Il nervo vago è il freno del sistema nervoso: parte dal tronco encefalico e scende fino all\u2019addome, toccando cuore, polmoni e gola. Questa sequenza mette in fila tre modi semplici per premerlo: respirare intorno ai sei respiri al minuto, allungare l\u2019espirazione, farla vibrare con un ronzio come nel respiro dell\u2019ape. Alla fine, sei respiri in silenzio per ascoltare cosa è cambiato. La sequenza è progettata dall\u2019app; i singoli elementi sono studiati.' },
  sblocca_naso: { story: 'Un esercizio classico del metodo Buteyko per il naso chiuso. Dopo un\u2019espirazione normale si chiude il naso con le dita e si muove la testa su e giù, o si cammina, finché il bisogno di respirare è forte; poi si riprende dal naso, piano. Secondo il metodo, la CO\u2082 che sale durante la pausa aiuta le cavità nasali a liberarsi. Molti lo trovano sorprendente la prima volta: provalo, senza aspettative.', lim: 'Fermati al primo segnale forte, senza forzare. Se sei in gravidanza, hai problemi di cuore o pressione alta, evita le pause lunghe e chiedi prima al medico.' },
  metta: { story: 'Metta, nella lingua pali, significa benevolenza. È una delle meditazioni più antiche del buddhismo e una delle più studiate dalla psicologia: si augura del bene a sé stessi, poi a una persona cara, a qualcuno che conosci appena, a qualcuno con cui fai fatica, e infine a tutti. Le ricerche mostrano più emozioni positive nella vita di tutti i giorni. Qui il respiro lento fa da tappeto, e ogni minuto la frase cambia.' },
  lascia: { story: 'Ispirato allo Yoga Nidra, il sonno dello yoga, una pratica in cui si resta svegli mentre il corpo dorme. Ogni inspirazione è un\u2019ancora di presenza, ogni espirazione un permesso a lasciar andare. I pensieri arrivano lo stesso: li noti, come nuvole che attraversano il cielo, e torni al respiro. Non c\u2019è nulla da completare: se il sonno arriva prima della fine, la pratica ha funzionato.' },
  bodyscan: { story: 'Un viaggio lento dai piedi alla testa, con il respiro come guida. A ogni espirazione la zona su cui sei si ammorbidisce un poco. È il modo più semplice per scoprire dove teniamo la tensione senza saperlo: quasi sempre spalle, mandibola e fronte. Non devi rilassare per forza: basta notare, e spesso il rilascio arriva da solo.' },
  sos: { story: 'Quando arriva l\u2019ondata, il pensiero corre e il respiro sale nel petto. Questa sequenza fa due cose, nell\u2019ordine giusto. Prima tre sospiri profondi scaricano l\u2019attivazione del corpo. Poi la tecnica dei cinque sensi sposta l\u2019attenzione dall\u2019interno, dove abita la paura, all\u2019esterno, una cosa alla volta: cinque cose che vedi, quattro che tocchi, tre suoni. È breve per scelta, e funziona meglio se la conosci prima di averne bisogno.' },
};
