    <div class="field"><label>Dose</label><div class="seg"><button data-bd="time" aria-pressed="${pr.dose === 'time'}" ${freeAny ? 'disabled' : ''}>Per tempo</button><button data-bd="blocks" aria-pressed="${pr.dose === 'params'}">Per blocchi</button></div>${freeAny ? '<p class="small muted">Con ritenzioni libere la dose è per blocchi.</p>' : ''}</div>
    ${pr.dose === 'time' ? `<div class="field"><label for="bTime">Tempo di pratica, secondi</label><input id="bTime" type="number" inputmode="numeric" value="${bd.time}"></div>` :
    `<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="field" style="flex:1"><label for="bBl">Blocchi</label><input id="bBl" type="number" inputmode="numeric" value="${bd.blocks}"></div><div class="field" style="flex:1"><label for="bCy">Cicli</label><input id="bCy" type="number" inputmode="numeric" value="${bd.cycles}"></div><div class="field" style="flex:1"><label for="bRe">Recupero s</label><input id="bRe" type="number" inputmode="numeric" value="${bd.rest}"></div></div>`}
    ${errs.length ? `<p class="err">${errs.map(esc).join('<br>')}</p>` : `<div class="summary">${plan.cycles ? `<span>Cicli completi</span><span>${plan.cycles}</span>` : ''}<span>Pratica effettiva</span><span>${fmt(plan.practiceTime)}${plan.hasFree ? ' + libera' : ''}</span><span>Preparazione / chiusura</span><span>${fmt(plan.prep)} / ${fmt(plan.fin)}</span><span class="tot">Totale</span><span class="tot">${fmt(plan.timedTotal)}${plan.hasFree ? ' + parte libera' : ''}</span></div>`}
    <div class="row"><button class="btn primary" id="bRun" ${errs.length ? 'disabled' : ''}>Prova</button><button class="btn ghost" id="bSave" ${errs.length ? 'disabled' : ''}>${bd.id ? 'Salva modifiche' : 'Salva preset'}</button>${bd.id ? '<button class="btn ghost" id="bDel">Elimina</button><button class="linkbtn" id="bNew">Nuova</button>' : ''}</div></div></div>`;
  $('#bName').oninput = e => { bd.name = e.target.value; };
  $$('[data-bk]', v).forEach(s => s.onchange = () => { const ph = bd.phases[+s.dataset.bk]; ph.k = s.value; if ((ph.k === 'in' || ph.k === 'out') && !ph.ch) ph.ch = 'naso'; if (ph.k !== 'in' && ph.k !== 'out') ph.ch = ''; if ((ph.k === 'in' || ph.k === 'out' || ph.k === 'rest') && (ph.s === '' || ph.s === null)) ph.s = 4; rerenderKeep(); });
  $$('[data-bs]', v).forEach(s => s.onchange = () => { bd.phases[+s.dataset.bs].s = s.value === '' ? '' : +s.value; rerenderKeep(); });
  $$('[data-bc]', v).forEach(s => s.onchange = () => { bd.phases[+s.dataset.bc].ch = s.value; });
  $$('[data-bt]', v).forEach(s => s.oninput = () => { bd.phases[+s.dataset.bt].t = s.value; });
  $$('[data-brm]', v).forEach(b => b.onclick = () => { bd.phases.splice(+b.dataset.brm, 1); rerenderKeep(); });
  $('#bAdd').onclick = () => { bd.phases.push({ k: 'out', s: 4, ch: 'naso', t: '' }); rerenderKeep(); };
  $$('[data-bd]', v).forEach(b => b.onclick = () => { bd.dose = b.dataset.bd; rerenderKeep(); });
  const n = (id, k) => { const el = $(id); if (el) el.onchange = () => { bd[k] = Math.max(k === 'rest' ? 0 : 1, Math.round(+el.value || 0)); rerenderKeep(); }; };
  n('#bTime', 'time'); n('#bBl', 'blocks'); n('#bCy', 'cycles'); n('#bRe', 'rest');
  const run = $('#bRun'); if (run) run.onclick = () => startSession(presetToPractice(bd), {}, { time: bd.time });
  const svb = $('#bSave'); if (svb) svb.onclick = () => { if (!bd.name) bd.name = 'Pratica ' + (S.presets.length + 1); if (!bd.id) { bd.id = 'u_' + Date.now(); S.presets.push(clone(bd)); } else { const i = S.presets.findIndex(p => p.id === bd.id); S.presets[i] = clone(bd); } save(); toast('Preset salvato'); rerenderKeep(); };
  const dl = $('#bDel'); if (dl) dl.onclick = () => { S.presets = S.presets.filter(p => p.id !== bd.id); save(); bd = newDraft(); rerenderKeep(); };
  const nw = $('#bNew'); if (nw) nw.onclick = () => { bd = newDraft(); rerenderKeep(); };
  $$('[data-pp]', v).forEach(b => b.onclick = () => { bd = clone(S.presets[+b.dataset.pp]); render(true); });
}

/* ======================= IMPOSTAZIONI ======================= */
function renderSettings() {
  const v = $('#view'), st = S.settings;
  const tg = (k, l, d) => `<label class="toggle"><span>${l}${d ? `<br><span class="small muted">${d}</span>` : ''}</span><input type="checkbox" data-tg="${k}" ${st[k] ? 'checked' : ''}></label>`;
  v.innerHTML = `<div class="wrap"><button class="back" id="pBack">${ICON.back}Indietro</button><h2 class="q">Impostazioni</h2>
    <div class="block"><h3>Aspetto</h3><div class="seg" style="padding-bottom:12px">${[['auto', 'Come il sistema'], ['light', 'Chiaro'], ['dark', 'Scuro'], ['night', 'Notte']].map(o => `<button data-th="${o[0]}" aria-pressed="${st.theme === o[0]}">${o[1]}</button>`).join('')}</div>${tg('nightAuto', 'Sessioni serali in modalità notte', 'Dalle 21 alle 6 la sessione passa ai toni caldi e scuri, poi l\u2019app torna come prima.')}</div>
    <div class="block"><h3>Sessione</h3>
      <div class="param"><div class="param-top"><label for="sPrep">Preparazione</label><span class="param-val" id="vPrep">${st.prep} s</span></div><div class="stepper"><input type="range" id="sPrep" min="0" max="30" step="5" value="${st.prep}"></div></div>
      <div class="param"><div class="param-top"><label for="sFin">Chiusura</label><span class="param-val" id="vFin">${st.fin} s</span></div><div class="stepper"><input type="range" id="sFin" min="0" max="30" step="5" value="${st.fin}"></div></div>
      ${tg('showSec', 'Secondi residui nel cerchio')}${tg('showFree', 'Tempo trascorso nelle ritenzioni libere', 'Spento di default: niente gare con il bisogno di respirare.')}${tg('wake', 'Tieni acceso lo schermo', 'Dove il browser lo consente.')}${tg('vib', 'Vibrazione attiva di default', canVib() ? 'Un impulso a ogni cambio di fase: breve all\u2019inspirazione, doppio all\u2019espirazione, lungo nelle ritenzioni. Ogni pratica ricorda la tua scelta.' : 'Questo browser non supporta la vibrazione (su iPhone non è disponibile).')}</div>
    <div class="block"><h3>Segnali sonori</h3>
      ${tg('sound', 'Attivi di default', 'Per le pratiche a occhi aperti. Quelle a occhi chiusi (Bhramari, Osservazione e conteggio, Tummo) li hanno attivi di default. Ogni pratica ricorda la tua scelta.')}
      <div class="param"><div class="param-top"><label for="sVol">Volume</label><span class="param-val" id="vVol">${Math.round(st.vol * 100)}%</span></div><div class="stepper"><input type="range" id="sVol" min="0.1" max="1" step="0.05" value="${st.vol}"><button class="btn ghost" id="sTry" style="padding:8px 14px">Prova</button></div></div>
      <p class="small muted" style="padding-bottom:12px">Inspirazione: tono che sale. Espirazione: tono che scende. Ritenzione: nota breve, acuta a pieni polmoni, grave a vuoto. Respirazioni rapide: un tocco per ciclo. Fine: tre note. Su iPhone l\u2019interruttore silenzioso può silenziarli.${Object.keys(S.sound).length ? ' <button class="linkbtn" id="sndReset">Ripristina le scelte per singola pratica</button>' : ''}</p></div>
    <div class="block"><h3>Dati su questo dispositivo</h3>
      <p class="small muted">Preset, livelli, valori di riferimento e tabelle restano nel browser.${storageOK ? '' : ' <b>In questo contesto il browser non permette di salvare.</b>'} Per spostarli copia il backup e incollalo sull\u2019altro dispositivo.</p>
      <textarea id="bk" rows="3" aria-label="Backup">${esc(JSON.stringify({ app: 'respiro', v: 1, data: { presets: S.presets, programs: S.programs, maxes: S.maxes, tables: S.tables, settings: S.settings, sound: S.sound } }))}</textarea>
      <div class="row" style="margin:10px 0 14px"><button class="btn ghost" id="bkCopy">Copia</button><button class="btn ghost" id="bkImp">Importa</button><button class="btn ghost" id="bkReset">Cancella tutto</button></div></div>
    <div class="block"><h3>Modalità delle pratiche</h3>${Object.keys(MODES).map(k => `<p class="small"><b>${MODES[k]}.</b> ${esc(MODE_HELP[k])}</p>`).join('')}<p class="small muted" style="padding:6px 0 12px">Versione ${APP_VERSION}, motore ${ENGINE_VERSION}. Ogni pratica è un dato compilato in una sequenza temporale deterministica.</p></div></div>`;
  $('#pBack').onclick = back;
  $$('[data-th]', v).forEach(b => b.onclick = () => { st.theme = b.dataset.th; save(); applyTheme(); rerenderKeep(); });
  $$('[data-tg]', v).forEach(c => c.onchange = () => { st[c.dataset.tg] = c.checked; save(); if (c.dataset.tg === 'vib' && c.checked) buzz([40]); });
  const rng = (id, k, out) => { const r = $(id); r.oninput = () => { $(out).textContent = r.value + ' s'; }; r.onchange = () => { st[k] = +r.value; save(); }; };
  rng('#sPrep', 'prep', '#vPrep'); rng('#sFin', 'fin', '#vFin');
  const vol = $('#sVol'); vol.oninput = () => { $('#vVol').textContent = Math.round(vol.value * 100) + '%'; }; vol.onchange = () => { st.vol = +vol.value; save(); audioInit(); CUE.in(); };
  $('#sTry').onclick = () => { audioInit(); CUE.in(); setTimeout(CUE.hi, 1000); setTimeout(CUE.out, 1700); };
  const sr = $('#sndReset'); if (sr) sr.onclick = () => { S.sound = {}; save(); toast('Scelte ripristinate'); rerenderKeep(); };
  $('#bkCopy').onclick = () => { const t = $('#bk'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Backup copiato'), () => toast('Seleziona e copia il testo')); } catch (e) { toast('Seleziona e copia il testo'); } };
  $('#bkImp').onclick = () => { try { const o = JSON.parse($('#bk').value); if (o.app !== 'respiro') throw 0; Object.assign(S, o.data); S.settings = Object.assign({}, DEFAULT.settings, S.settings); S.sound = S.sound || {}; save(); applyTheme(); toast('Backup importato'); rerenderKeep(); } catch (e) { toast('Il testo non è un backup di Respiro valido'); } };
  $('#bkReset').onclick = () => { const b = $('#bkReset'); if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tocca di nuovo per cancellare'; return; } S = clone(DEFAULT); save(); applyTheme(); toast('Dati cancellati'); rerenderKeep(); };
}

/* ---------- avvio ---------- */
$('#logo').innerHTML = ICON.logo; $('#btnSettings').innerHTML = ICON.gear; $('#btnSettings').onclick = () => go('settings');
$$('.seg-nav button').forEach(b => b.onclick = () => go(b.dataset.v));
const qs = (location.search.match(/[?&]v=([a-z]+)/) || [])[1];
route = { name: qs && TABS.indexOf(qs) >= 0 ? qs : 'home' }; render(false);
window.__respiro = { S: () => S, ss: () => ss, startSession, openPractice, startProgram, runTest, go };
})();

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window.self) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
